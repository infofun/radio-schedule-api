name: Update Radio Schedule

on:
  schedule:
    # 매일 자정(KST 00:00)은 UTC 기준 15:00 입니다.
    - cron: '1 15 * * *'
  workflow_dispatch: # 수동 실행을 위한 트리거

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
    - name: 레포지토리 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      working-directory: ./

    - name: 스크래핑 스크립트 실행
      run: python update_schedule.py
      working-directory: ./

    - name: 변경사항 커밋 및 푸시
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add schedule.json
        # 변경사항이 있을 경우에만 커밋
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update radio schedule"
        git push
