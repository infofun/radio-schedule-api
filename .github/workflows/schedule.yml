name: Update Radio Schedule

on:
  schedule:
    # 1. 매일 자정 캘린더 일자 변경 (정각 트래픽 회피: KST 00:17 -> UTC 15:17)
    - cron: '17 15 * * *'
    # 2. 라디오 방송일자 변경 및 정규 방송 시작 (정각 트래픽 회피: KST 05:13 -> UTC 20:13)
    - cron: '13 20 * * *'
    # 3. 방송국 담당자 수동 업데이트 반영 시간 (정각 트래픽 회피: KST 10:14 -> UTC 01:14)
    - cron: '14 1 * * *'
  workflow_dispatch: # 수동 실행을 위한 트리거

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
    - name: 레포지토리 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      working-directory: ./

    # 💡 [추가된 부분] 파이썬 스크립트 실행 전 네트워크 차단 여부 테스트
#    - name: EBS 접속 테스트 (방화벽 차단 확인)
#      run: curl -v https://www.ebs.co.kr/ --connect-timeout 10
#      continue-on-error: true # 테스트 실패로 인해 전체 액션이 중단되지 않도록 방지

#    - name: 국악방송 접속 테스트 (방화벽 차단 확인)
#      run: curl -v https://www.igbf.kr/ --connect-timeout 10
#      continue-on-error: true # 테스트 실패로 인해 전체 액션이 중단되지 않도록 방지
    # -------------------------------------------------------------

    - name: 스크래핑 스크립트 실행
      run: python update_schedule.py
      working-directory: ./

    - name: 변경사항 커밋 및 푸시
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add schedule.json
        
        # 변경사항이 있을 경우에만 커밋 (현재 KST 시간을 커밋 메시지에 포함하면 추적하기 좋습니다)
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update radio schedule ($(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M'))"
        git push
